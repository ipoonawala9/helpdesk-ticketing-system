spring.application.name=HelpDesk
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool, sized for a small instance and a small managed database.
# The pool holds no idle connections and lets them go after a few minutes, so a
# managed database that sleeps when unused is actually able to: a pool that
# keeps connections open forever keeps the meter running around the clock.
# These are milliseconds: Hikari takes plain numbers here, and an ISO duration
# such as PT2M stops the application starting at all.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1200000
# A sleeping database needs a moment to wake up before the first query lands,
# and the application should wait for it rather than refuse to start.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# All entity-to-DTO mapping happens inside transactional service methods, so
# there is no need to keep a Hibernate session open for view rendering.
spring.jpa.open-in-view=false

# Ticket workflow time windows (ISO-8601 durations).
# How long the customer has to confirm a resolution before an organization
# administrator may close the ticket on their behalf.
helpdesk.tickets.admin-close-after=PT3H
# How long after closure the customer may still reopen a ticket.
helpdesk.tickets.reopen-window=P7D

# Access tokens. JWT_SECRET must be a random value of at least 32 characters;
# the application refuses to start without it. Never commit a real value.
helpdesk.security.jwt.secret=${JWT_SECRET:}
helpdesk.security.jwt.access-token-ttl=PT1H
helpdesk.security.jwt.issuer=helpdesk

# First super admin, created on startup if no account with this email exists.
helpdesk.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
helpdesk.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
helpdesk.bootstrap.super-admin.name=${BOOTSTRAP_SUPER_ADMIN_NAME:Super Admin}
# Changing BOOTSTRAP_SUPER_ADMIN_PASSWORD does not affect an account that
# already exists. Set this to true for a single restart to reset a forgotten
# super admin password, then unset it.
helpdesk.bootstrap.super-admin.reset-password=${BOOTSTRAP_SUPER_ADMIN_RESET_PASSWORD:false}

# Browser origins allowed to call the API from another site (the hosted
# frontend), comma-separated, e.g. https://helpdesk-web.onrender.com
helpdesk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Password guessing: after this many wrong passwords for one email within the
# window, sign-in for that email is refused until the window has passed.
helpdesk.security.login.max-failures=5
helpdesk.security.login.window=PT15M

# Health checks for hosting platforms. Only the health endpoint is exposed,
# without details. /actuator/health/liveness does not depend on the database,
# so a slow database wake-up does not get the service restarted.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# API documentation at /swagger-ui.html. Set API_DOCS_ENABLED=false to hide it.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Behind a hosting platform's HTTPS proxy, honour X-Forwarded-* headers from
# private-network proxies so generated URLs (e.g. Swagger's) use https.
server.forward-headers-strategy=native

# Password reset links. Without a mail server the link is written to the log,
# so the feature works before email is set up; set spring.mail.* to email it.
helpdesk.security.password-reset.valid-for=PT30M
helpdesk.security.password-reset.max-requests=3
helpdesk.security.password-reset.from=${MAIL_FROM:no-reply@helpdesk.local}

# Where the browser app is served, used to build links sent to people.
helpdesk.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
