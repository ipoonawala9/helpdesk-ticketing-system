# Runs the whole test suite against a real PostgreSQL 17 container instead of
# H2. Needs Docker:
#   SPRING_PROFILES_ACTIVE=postgres ./mvnw test
# The Testcontainers JDBC driver starts the container on first connection and
# reuses it for every test context in the run.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///helpdesk
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
