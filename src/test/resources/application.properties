spring.application.name=HelpDesk

# Tests run against in-memory H2 in PostgreSQL compatibility mode so the suite
# does not require a live database or any environment variables.
spring.datasource.url=jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Lets tests count SQL statements to guard against N+1 queries.
spring.jpa.properties.hibernate.generate_statistics=true

# Test-only signing key and bootstrap account. Not used anywhere else.
helpdesk.security.jwt.secret=test-only-signing-key-not-a-real-secret-0123456789
helpdesk.bootstrap.super-admin.email=superadmin@helpdesk.test
helpdesk.bootstrap.super-admin.password=super-admin-test-password

helpdesk.cors.allowed-origins=http://localhost:5173
