# Local full-stack backend: PostgreSQL 17 and the HelpDesk API.
#
#   cp .env.example .env      # then fill in the values
#   docker compose up -d --build
#
# The API is then on http://localhost:8080. Data is kept in the helpdesk-data
# volume across restarts; `docker compose down -v` deletes it.
name: helpdesk

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - helpdesk-data:/var/lib/postgresql/data
    # Published on 55432 so it does not clash with another PostgreSQL on 5432.
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: helpdesk-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  helpdesk-data:
