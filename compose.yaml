# Local full-stack backend: PostgreSQL 17 and the HelpDesk API.
#
#   cp .env.example .env      # then fill in the values
#   docker compose up -d --build
#
# The API is then on http://localhost:8080. Data is kept in the helpdesk-data
# volume across restarts; `docker compose down -v` deletes it.
name: helpdesk

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - helpdesk-data:/var/lib/postgresql/data
    # Published on 55432 so it does not clash with another PostgreSQL on 5432,
    # and only on this machine, not to the rest of the network.
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: helpdesk-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      # Set to true in .env for a single restart to reset a forgotten super
      # admin password, then set it back to false.
      BOOTSTRAP_SUPER_ADMIN_RESET_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_RESET_PASSWORD:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # The JRE image has no curl, so bash's /dev/tcp makes the request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  helpdesk-data:
